<!--
  JBI — Post-Operative Care shared style (.jbi-svc)
  This <style> block is embedded (identical) at the top of every post-op
  Code Block in this folder: post-operative-care.html (hub) + the 4 service
  sub-pages. It is kept here on its own only as the canonical copy to edit.

  WORKFLOW: if you change the styling, edit it HERE first, then paste the
  updated <style> into each page file so they stay in sync.
-->
<style>
  .jbi-svc{
    width:100vw;
    position:relative;
    left:50%;
    right:50%;
    margin-left:-50vw;
    margin-right:-50vw;
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#1a1f2a;
    background:#fff;
  }
  .jbi-svc *{box-sizing:border-box;}
  .jbi-svc a{text-decoration:none;}
  .jbi-svc h1,.jbi-svc h2,.jbi-svc h3,.jbi-svc p{margin-top:0;}

  .jbi-svc .inner{max-width:1180px;margin:0 auto;padding:0 48px;}

  .jbi-svc-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    background:#c89a3a;color:#081a30;font-size:13px;font-weight:800;
    letter-spacing:1.1px;text-transform:uppercase;padding:16px 26px;
    border-radius:3px;transition:all .25s ease;
  }
  .jbi-svc-btn:hover{background:#a37a27;transform:translateY(-2px);box-shadow:0 12px 28px rgba(200,154,58,.28);}
  .jbi-svc-btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.34);}
  .jbi-svc-btn.ghost:hover{background:#fff;color:#0f2d4f;box-shadow:none;}

  /* HERO */
  .jbi-svc-hero{
    background:
      radial-gradient(circle at top right, rgba(200,154,58,.18), transparent 34%),
      radial-gradient(circle at bottom left, rgba(46,90,135,.48), transparent 34%),
      #0f2d4f;
    padding:88px 0 80px;color:#fff;text-align:center;overflow:hidden;
  }
  .jbi-svc-crumb{
    display:inline-block;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;
    font-weight:800;color:#f2d08a;margin-bottom:18px;
  }
  .jbi-svc-crumb a{color:#f2d08a;}
  .jbi-svc-crumb a:hover{color:#fff;}
  .jbi-svc-eyebrow{
    font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#c89a3a;
    font-weight:800;margin-bottom:14px;
  }
  .jbi-svc-hero h1{
    font-size:54px;line-height:1.04;letter-spacing:-1.8px;font-weight:850;
    color:#fff;margin:0 auto 16px;max-width:880px;
  }
  .jbi-svc-hero h1 .accent{color:#c89a3a;font-style:italic;font-weight:500;}
  .jbi-svc-lede{
    font-size:20px;line-height:1.6;color:#e6edf5;max-width:720px;margin:0 auto 28px;
  }
  .jbi-svc-actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;}

  /* HUB CARD GRID */
  .jbi-svc-cards-wrap{background:#f5efe3;padding:74px 0;}
  .jbi-svc-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;}
  .jbi-svc-card{
    display:flex;flex-direction:column;background:#fff;border:1px solid rgba(15,45,79,.08);
    border-radius:20px;padding:30px 30px 26px;box-shadow:0 14px 36px rgba(15,45,79,.06);
    transition:all .25s ease;
  }
  .jbi-svc-card:hover{transform:translateY(-4px);box-shadow:0 22px 50px rgba(15,45,79,.13);border-color:rgba(200,154,58,.5);}
  .jbi-svc-card .num{
    font-size:12px;letter-spacing:1.7px;text-transform:uppercase;color:#a37a27;
    font-weight:900;margin-bottom:12px;
  }
  .jbi-svc-card h3{font-size:24px;line-height:1.15;letter-spacing:-.5px;color:#0f2d4f;font-weight:850;margin-bottom:10px;}
  .jbi-svc-card p{font-size:16px;line-height:1.6;color:#3a3f4a;margin-bottom:18px;}
  .jbi-svc-card .go{margin-top:auto;font-size:13px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#a37a27;}
  .jbi-svc-card:hover .go{color:#0f2d4f;}

  /* BODY (sub-pages) */
  .jbi-svc-main{padding:78px 0 92px;}
  .jbi-svc-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:56px;align-items:start;}
  .jbi-svc-section{margin-bottom:42px;}
  .jbi-svc-section:last-child{margin-bottom:0;}
  .jbi-svc-section h2{font-size:32px;line-height:1.12;letter-spacing:-.8px;color:#0f2d4f;font-weight:850;margin-bottom:16px;}
  .jbi-svc-section h2 .accent{color:#a37a27;font-style:italic;font-weight:500;}
  .jbi-svc-section p{font-size:17px;line-height:1.75;color:#3a3f4a;margin-bottom:18px;}
  .jbi-svc-section ul{margin:0 0 18px;padding:0;list-style:none;}
  .jbi-svc-section ul li{
    position:relative;padding:0 0 12px 28px;font-size:17px;line-height:1.6;color:#3a3f4a;
  }
  .jbi-svc-section ul li::before{
    content:"";position:absolute;left:2px;top:9px;width:9px;height:9px;border-radius:50%;
    background:#c89a3a;
  }
  .jbi-svc-callout{
    background:#f5efe3;border-left:4px solid #c89a3a;border-radius:14px;padding:22px 26px;margin:26px 0 0;
  }
  .jbi-svc-callout p{margin:0;color:#0f2d4f;font-weight:650;font-size:16px;line-height:1.6;}

  /* SIDEBAR */
  .jbi-svc-sidebar{position:sticky;top:24px;}
  .jbi-svc-side-card{
    background:#0f2d4f;color:#fff;border-radius:22px;padding:28px;
    box-shadow:0 24px 54px rgba(15,45,79,.18);margin-bottom:22px;
  }
  .jbi-svc-side-card h3{color:#fff;font-size:22px;line-height:1.15;font-weight:850;margin-bottom:10px;}
  .jbi-svc-side-card p{color:#cdd6e2;font-size:15px;line-height:1.6;margin-bottom:20px;}
  .jbi-svc-side-card .jbi-svc-btn{width:100%;}
  .jbi-svc-list-card{
    background:#fff;border:1px solid rgba(15,45,79,.09);border-radius:22px;padding:26px;
    box-shadow:0 14px 36px rgba(15,45,79,.07);
  }
  .jbi-svc-list-card h3{color:#0f2d4f;font-size:19px;font-weight:850;letter-spacing:-.3px;margin-bottom:14px;}
  .jbi-svc-list{list-style:none;padding:0;margin:0;}
  .jbi-svc-list li{border-top:1px solid rgba(15,45,79,.08);}
  .jbi-svc-list li:first-child{border-top:0;}
  .jbi-svc-list a{display:block;padding:13px 0;color:#0f2d4f;font-weight:800;font-size:15px;line-height:1.4;}
  .jbi-svc-list a:hover{color:#a37a27;}

  /* BOTTOM CTA */
  .jbi-svc-bottom-cta{
    background:radial-gradient(circle at top right, rgba(200,154,58,.16), transparent 30%),#081a30;
    padding:74px 0;text-align:center;
  }
  .jbi-svc-bottom-cta h2{color:#fff;font-size:40px;line-height:1.1;letter-spacing:-1.1px;font-weight:850;margin-bottom:14px;}
  .jbi-svc-bottom-cta h2 .accent{color:#c89a3a;font-style:italic;font-weight:500;}
  .jbi-svc-bottom-cta p{color:#cdd6e2;font-size:18px;line-height:1.6;max-width:620px;margin:0 auto 28px;}

  @media(max-width:980px){
    .jbi-svc .inner{padding:0 24px;}
    .jbi-svc-hero{padding:68px 0 60px;}
    .jbi-svc-hero h1{font-size:40px;letter-spacing:-1.1px;}
    .jbi-svc-lede{font-size:18px;}
    .jbi-svc-cards{grid-template-columns:1fr;}
    .jbi-svc-layout{grid-template-columns:1fr;gap:40px;}
    .jbi-svc-sidebar{position:static;}
    .jbi-svc-section h2{font-size:27px;}
    .jbi-svc-bottom-cta h2{font-size:30px;}
  }
  @media(max-width:620px){
    .jbi-svc-actions{flex-direction:column;}
    .jbi-svc-btn{width:100%;}
  }
</style>
