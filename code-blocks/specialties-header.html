<!--
  JBI — Specialties section header
  Place this Code Block DIRECTLY ABOVE the live Specialties Summary Block
  (same section, header on top). Recreates the "Care We Provide" header:
  eyebrow + title with brass italic accent + top-right "Explore all specialties" button.
  Edit the title/eyebrow/button text and link below as needed.
-->
<style>
  .jbi-spechead-wrap{
    width:100vw;
    position:relative;
    left:50%; right:50%;
    margin-left:-50vw; margin-right:-50vw;
    background:#ffffff;
  }
  .jbi-spechead{
    max-width:1440px; margin:0 auto;
    padding:64px 48px 8px;
    font-family:'Archivo',-apple-system,sans-serif;
  }
  .jbi-spechead-head{
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:32px; flex-wrap:wrap;
  }
  .jbi-spechead-eyebrow{
    font-size:16px; letter-spacing:3.5px; text-transform:uppercase;
    color:#2e5a87; font-weight:700; margin-bottom:22px;
  }
  .jbi-spechead-title{
    font-family:'Roboto Slab',Georgia,serif;
    font-size:56px; font-weight:900; letter-spacing:-2px;
    line-height:1.02; color:#0f2d4f; margin:0;
    max-width:720px;
  }
  .jbi-spechead-title .accent{color:#a37a27; font-style:italic; font-weight:500;}
  .jbi-spechead-cta{
    background:transparent; color:#0f2d4f;
    border:1.5px solid #0f2d4f;
    padding:13px 22px; font-size:13px; font-weight:700;
    letter-spacing:1.2px; text-transform:uppercase;
    border-radius:2px; cursor:pointer;
    text-decoration:none; display:inline-block;
    transition:all 0.2s ease; white-space:nowrap;
  }
  .jbi-spechead-cta:hover{background:#0f2d4f; color:#f5efe3; transform:translateY(-2px);}

  @media (max-width:1000px){
    .jbi-spechead{padding:48px 24px 8px;}
    .jbi-spechead-title{font-size:40px; letter-spacing:-1.2px;}
  }
</style>

<div class="jbi-spechead-wrap">
  <div class="jbi-spechead">
    <div class="jbi-spechead-head">
      <div>
        <div class="jbi-spechead-eyebrow">— Specialties</div>
        <h2 class="jbi-spechead-title">The care <span class="accent">we provide.</span></h2>
      </div>
      <a class="jbi-spechead-cta" href="/specialties">Explore all specialties →</a>
    </div>
  </div>
</div>
